services:
  ambrace:
    build: .
    image: ambrace:latest
    container_name: ambrace
    ports:
      - "8000:8000"
    environment:
      - INSTANCE_LOCK_PORT=8766
      - CORS_ORIGINS=*
      # CI 冒烟短路：设 SKIP_MODEL_DOWNLOAD=1 跳过 bge-m3 首启下载（避免 CI 卡死在 542MB）；默认 0 保持原行为
      - SKIP_MODEL_DOWNLOAD=${SKIP_MODEL_DOWNLOAD:-0}
    volumes:
      # 模型（发布包自带 backend/models/bge-m3，542MB；未下载则启动后记忆功能报错）
      - ./backend/models:/app/backend/models
      # 数据（SQLite + ChromaDB 持久化）
      - ./backend/data:/app/backend/data
      # 配置（项目根 .env：DEEPSEEK_API_KEY 等）
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=5)"]  # health=进程存活；模型就绪看 /api/v1/system/ready
      interval: 30s
      timeout: 10s
      retries: 5
      # 首启自动下载 bge-m3（约 542MB）会阻塞 uvicorn 启动，healthcheck 需覆盖下载时间（2026-08-24）
      start_period: 300s
