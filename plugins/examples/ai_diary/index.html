<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 写日记</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #fdf6ec 0%, #fdeef0 100%);
      min-height: 100vh;
      color: #3a3a3c;
      padding: 20px 16px 40px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(160deg, #241f2e 0%, #2a2233 100%); color: #e8e6ea; }
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 28px rgba(120, 80, 60, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      .card { background: rgba(44, 38, 56, 0.85); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35); }
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { font-size: 12px; color: #9a8f94; margin-bottom: 14px; }
    label { font-size: 13px; font-weight: 600; display: block; margin: 12px 0 6px; }
    select, textarea, button {
      width: 100%;
      font-size: 14px;
      border-radius: 12px;
      border: 1px solid rgba(150, 130, 120, 0.3);
      background: rgba(255, 255, 255, 0.9);
      color: inherit;
      padding: 10px 12px;
      font-family: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: flex; gap: 10px; align-items: center; }
    .row button { flex: 1; }
    button.primary {
      background: #e8846c;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
    button.ghost {
      background: transparent;
      border: 1px solid rgba(150, 130, 120, 0.4);
      color: inherit;
      margin-top: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: default; }
    #status { font-size: 12px; color: #a08a70; min-height: 18px; margin-top: 10px; }
    #result {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(232, 132, 108, 0.10);
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      display: none;
    }
    .hint { font-size: 11px; color: #b3a69b; margin-top: 10px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📔 AI 写日记</h1>
    <div class="sub">把今天的事写下来，AI 帮你写成一篇有温度的日记</div>

    <label for="mode">写作方式</label>
    <div class="row">
      <select id="mode">
        <option value="ai">选择 AI 伙伴（按角色人设）</option>
        <option value="prompt">自定义提示词（日记助手）</option>
      </select>
    </div>

    <div id="aiRow">
      <label for="aiList">AI 伙伴</label>
      <select id="aiList"><option value="">加载中…</option></select>
    </div>

    <label for="input">今天发生了什么？</label>
    <textarea id="input" placeholder="例如：今天和朋友去爬山，山顶的风很大，但看到日落的那一刻觉得一切都值得…"></textarea>

    <button id="writeBtn" class="primary">✍️ 写日记</button>
    <div id="status"></div>
    <div id="result"></div>

    <button id="saveBtn" class="ghost">💾 保存到本插件存储</button>
    <button id="loadBtn" class="ghost">📂 读取已保存的日记</button>

    <div class="hint">
      本页通过插件桥（window.Ambrace）调用宿主能力：getAiList / ai / store.set / store.get。
      日记存储按「插件 × 用户」隔离，仅自己可见。
    </div>
  </div>

  <script src="plugin-bridge.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
