name: ai_companion
description: AMBRACE（拥爱）- 自托管的 AI 伙伴陪伴应用
publish_to: none
version: 3.2.2+9

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  web_socket_channel: ^3.0.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^18.0.1
  flutter_background_service: ^5.0.10
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  file_picker: ^11.0.3
  record: ^6.2.1
  audioplayers: ^6.1.0
  geolocator: 13.0.2
  crop_your_image: ^2.0.0
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/pet_pixel_art/
    - assets/life_visual/
    - assets/reward_qrcode.png
    - assets/ic_launcher.png
