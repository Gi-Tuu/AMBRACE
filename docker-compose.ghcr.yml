# AMBRACE GHCR 镜像版（2026-08-23）：不想本地 build 的用户直接拉取公开镜像
# 用法：docker compose -f docker-compose.ghcr.yml up -d
#   （镜像首次启动会自动下载 bge-m3 向量模型到 ./backend/models 卷，约 542MB）
services:
  ambrace:
    image: ghcr.io/gi-tuu/ambrace:latest
    pull_policy: always
    container_name: ambrace
    ports:
      - "8000:8000"
    environment:
      - INSTANCE_LOCK_PORT=8766
      - CORS_ORIGINS=*
    volumes:
      # 模型（镜像内不含 bge-m3，首启自动下载后缓存在此卷；可预置已含模型的目录）
      - ./backend/models:/app/backend/models
      # 数据（SQLite + ChromaDB 持久化）
      - ./backend/data:/app/backend/data
      # 配置（项目根 .env：DEEPSEEK_API_KEY 等）
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=5)"]  # health=进程存活；模型就绪看 /api/v1/system/ready
      interval: 30s
      timeout: 10s
      retries: 5
      # 首启自动下载 bge-m3（约 542MB）会阻塞 uvicorn 启动，healthcheck 需覆盖下载时间（2026-08-24）
      start_period: 300s
