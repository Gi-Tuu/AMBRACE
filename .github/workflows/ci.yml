name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  # 变更侦测（2026-09-12）：只动 flutter_app/ 或 docs/ 的推送，跳过与前端无关的重量级任务
  # （Windows 后端矩阵 + Docker 构建/冒烟）；其余任何情况一律全开，避免漏检。
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Decide whether heavy jobs are needed
        shell: bash
        run: |
          set -u
          BASE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "非 push 事件或拿不到上一个提交 -> 全开"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$BASE" >/dev/null 2>&1 || true
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "取不到基线提交 -> 全开"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" HEAD || true)"
          echo "变更文件（最多显示 50 个）："
          printf '%s\n' "$CHANGED" | head -n 50
          if [ -z "$CHANGED" ]; then
            echo "无差异信息 -> 全开"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OTHER="$(printf '%s\n' "$CHANGED" | grep -vE '^(flutter_app/|docs/)' || true)"
          if [ -n "$OTHER" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "仅 flutter_app/ 与 docs/ 变更 -> 跳过重量级任务"
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend py${{ matrix.py }} (ruff + pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 项目声明的支持范围：setup.sh/README 声明 3.12+；本地 venv 为 3.14（pyproject target-version=py314）。
        # 锁文件在本地 3.14/Windows 生成（仅本机运行时可用）；个别钉版平台 wheel 若在 3.12/3.13 缺失，
        # 会由本 matrix 在 CI 捕获（NEEDS_RUNTIME_VERIFICATION）。
        py: [ "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r backend/requirements.txt

      - name: Lint (ruff)
        run: ruff check backend/app

      - name: Forbid namespace-injection seam
        run: |
          if grep -RnE "globals\(\)\[|globals\(\)\.update|for name, val in vars\(" backend/app; then
            echo "namespace injection seam is not allowed after removal"; exit 1
          fi

      - name: Prevent init_db manual-DDL resurgence (3.8 FREEZE)
        run: python .github/scripts/check_initdb_ddl_freeze.py

      - name: Prevent frozen-dir file resurgence (3.7 FREEZE)
        run: python .github/scripts/check_frozen_dirs.py

      - name: Test (pytest)
        run: pytest backend/tests -q

  # 主开发 / 发 APK 在 Windows：覆盖 Windows 特有路径、SO_REUSEADDR、aiosqlite 线程、
  # pwsh 脚本语法（不跑 Docker smoke）。
  backend-windows:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: Backend py${{ matrix.python-version }} (Windows, ruff + pytest)
    runs-on: windows-latest
    # 观察期设置（临时）：Windows job 首次入 CI，平台相关失败暂不阻塞主线；
    # 稳定后（建议观察约一周）删除本行转强制门禁。
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app

      - name: Test (pytest)
        working-directory: backend
        env:
          SKIP_MODEL_DOWNLOAD: "1"
        run: pytest -q -p no:cacheprovider

  frontend:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Test
        working-directory: flutter_app
        run: flutter test

  smoke:
    name: Docker build + health + API smoke
    runs-on: ubuntu-latest
    needs: [backend, changes]
    if: needs.changes.outputs.heavy == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Build image (models skipped; smoke only hits process-health)
        run: docker build -t ambrace:ci .

      - name: Prep writable dirs for non-root container
        run: |
          mkdir -p backend/data backend/models
          sudo chown -R 10001:10001 backend/data backend/models
          cp .env.example .env

      - name: Compose up (SKIP_MODEL_DOWNLOAD=1 short-circuits the ~542MB model fetch)
        run: |
          SKIP_MODEL_DOWNLOAD=1 INSTANCE_LOCK_PORT=8766 docker compose up -d

      - name: Wait health then smoke
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/system/health && break || sleep 2
          done
          python scripts/smoke_test.py

      - if: always()
        run: docker compose logs --tail=200

      - if: always()
        run: docker compose down -v
