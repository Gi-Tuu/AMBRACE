# Alembic configuration for AMBRACE backend DB migrations.
# Run from the backend/ directory:
#   alembic upgrade head                       # fresh DB: build schema up to head via version chain
#   alembic stamp head                         # legacy DB: mark current DB as migrated (no migration run)
#   alembic revision --autogenerate -m "desc"  # future schema change: compare models to DB, generate revision
#   alembic history / current                  # inspect chain / current revision
#
# NOTE: The sqlalchemy URL is intentionally empty here. env.py builds the engine
# from app.config.settings.database_url and derives a synchronous URL (drops +aiosqlite).

[alembic]
# Migration scripts directory (relative to this ini file, i.e. backend/).
script_location = alembic

# SQLAlchemy engine URL: leave empty; env.py generates it from settings.database_url.
sqlalchemy.url =

# Prepend current dir to sys.path so env.py can import app.*.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
