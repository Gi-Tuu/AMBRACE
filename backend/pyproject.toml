[tool.ruff]
line-length = 120
target-version = "py314"  # ruff 目标固定 py314（与项目 venv 3.14 一致，含 PEP 701 f-string 语法）；部署最低要求 Python 3.12（见 scripts/setup.sh）
exclude = [".venv", "data", "scripts"]

[tool.ruff.lint]
# 只启用 F 类（未使用 import/变量、未定义名、f-string 问题，对应原 pyflakes）
# 项目既有宽松 except Exception 风格等 E/BLE 规则不启用，避免海量噪音
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# F4/F3 接缝模块：函数体裸名字由 _sync_seams 在调用时从 service/context_builder 动态同步，
# 静态检查视为未定义（F821）属预期；调用时同步保证 monkeypatch 接缝与拆分前一致
"app/memory/write.py" = ["F821"]
"app/memory/retrieve.py" = ["F821"]
"app/memory/maintain.py" = ["F821"]
"app/agent/context/legacy.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 2026-08-24：静音已知第三方弃用警告（chromadb 的 asyncio.iscoroutinefunction，Python 3.16 才移除），
# 保持测试输出干净；项目自身警告不静音（aiosqlite 线程泄漏属偶发真实问题，见 dev-changelog 2026-08-17）。
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.telemetry.opentelemetry",
]
